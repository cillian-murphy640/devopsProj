name: Mark issue done on push
on:
  push:
    branches: [main]

permissions:
  issues: write

jobs:
  mark-done:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.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  }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          for n in $(echo "$MSG" | grep -oiE 'done #[0-9]+' | grep -oE '[0-9]+'); do
            gh issue edit "$n" --repo "${{ github.repository }}" --add-label done
          done
